<html lang="en">

<title>Coldbrew</title>
<link rel="icon" type="image/svg+xml" href="/mark.svg">
<style>

  /* Coldbrew: a slow-brewed workbench. Espresso by default after dark, crema by day; one action colour (caramel). */

  .empty { color:var(--ink-3); padding:22px 6px; text-align:center; }
  .note { background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; color:var(--ink-2); font-size:14px; }

  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; } .chips button { padding:5px 11px; font-size:13px; border-radius:99px; }

  td { padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; } tbody tr { cursor:pointer; transition:background .12s; } tbody tr:hover { background:var(--panel-2); } tbody tr.sel { background:var(--accent-soft); }
  td .nm { font-weight:650; } td .sm { color:var(--ink-3); font-size:12.5px; } .score { display:inline-flex; align-items:center; gap:8px; font-weight:650; } .score i { display:inline-block; width:44px; height:6px; border-radius:99px; background:var(--panel-2); overflow:hidden; position:relative; } .score i b { position:absolute; inset:0 auto 0 0; background:var(--c3); border-radius:99px; }

  .drawer h2 { font-size:20px; } .sec { margin-top:20px; } .sec h3 { margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; }
  .kv { display:grid; grid-template-columns:110px minmax(0,1fr); gap:6px 12px; font-size:14px; } .kv dt { color:var(--ink-3); } .kv dd { word-break:break-word; }
  .draft { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:16px; margin-bottom:12px; } .draft textarea { min-height:140px; font-size:14.5px; } .draft input { font-weight:600; }
  .lint { margin:8px 0; display:grid; gap:4px; font-size:13.5px; } .lint div { padding-left:20px; position:relative; } .lint div:before { position:absolute; left:0; font-weight:800; } .lint .error:before { content:"×"; color:var(--bad); } .lint .warning:before { content:"!"; color:var(--warn); } .lint .okline:before { content:"✓"; color:var(--good); }
  .thread { display:grid; gap:8px; } .msg { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; font-size:14px; white-space:pre-wrap; } .msg.in { border-left:3px solid var(--good); } .msg small { display:block; color:var(--ink-3); margin-bottom:4px; }
  .modal-back { position:fixed; inset:0; background:rgba(10,6,3,.55); display:grid; place-items:center; z-index:40; padding:16px; animation:fade .2s ease both; } .modal { background:var(--panel); border:1px solid var(--line-2); border-radius:12px; padding:22px; width:min(460px,100%); box-shadow:0 30px 70px -20px rgba(0,0,0,.6); } .modal h2 { margin-bottom:6px; } .modal p { color:var(--ink-2); margin-bottom:12px; } .modal .row { justify-content:flex-end; margin-top:16px; }

  .auth { max-width:400px; margin:12vh auto 0; padding:0 18px; } .auth .brand { padding:0 0 18px; font-size:22px; } .auth p { color:var(--ink-2); margin:6px 0 18px; }
  .step { display:flex; gap:12px; align-items:flex-start; } .step b { flex:none; width:26px; height:26px; border-radius:99px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:13px; }

<body>
<div id="app"></div>
<script>
"use strict";
